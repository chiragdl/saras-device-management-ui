# The website (a template: ${API_UPSTREAM} is filled in when the container starts). Same headers as public/web.config.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # the API, as one site with the pages (sign-in cookie, no CORS)
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }
    location /health/ { proxy_pass ${API_UPSTREAM}; }

    location = /config.json { add_header Cache-Control "no-store" always; add_header X-Content-Type-Options "nosniff" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always;
                             add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always; }
    location /assets/ { add_header Cache-Control "public, max-age=2592000, immutable" always; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }

    # the app's own routes fall back to the page
    location / { try_files $uri /index.html; }
}
